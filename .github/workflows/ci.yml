name: Lazy Nerds FixOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Quality & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend ESLint Check
        run: npm --prefix frontend run lint

      - name: Frontend TypeScript Typecheck
        run: cd frontend && npx tsc --noEmit

      - name: Frontend Unit & Integration Tests (105 Tests)
        run: npm --prefix frontend test

      - name: Frontend Production Build
        run: npm --prefix frontend run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: Backend Test Suite & Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start Vulnerable Lab Server
        run: |
          python lab/vulnerable_app/main.py &
          for i in {1..20}; do
            if curl -s http://127.0.0.1:8888/api/products > /dev/null; then
              echo "Lab server online and responding on port 8888"
              break
            fi
            sleep 0.5
          done

      - name: Verify Database Migrations (Schema & Alembic Revisions)
        run: |
          PYTHONPATH=backend pytest backend/tests/test_migration.py -v
        env:
          ENVIRONMENT: testing
          ALLOW_LAB_TESTING: "true"
          WORKER_DISPATCH_MODE: "distributed"
          DATABASE_URL: "sqlite:////tmp/migration_test.db"
          SECRET_KEY: ci-test-secret-key-lazy-nerds-fixops-2026-very-secure

      - name: Run Backend Pytest Suite
        id: pytest_step
        continue-on-error: true
        run: |
          PYTHONPATH=backend pytest backend/tests -k "not integration and not live" -v --tb=short 2>&1 | tee pytest_output.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        env:
          ENVIRONMENT: testing
          ALLOW_LAB_TESTING: "true"
          WORKER_DISPATCH_MODE: "distributed"
          DATABASE_URL: "sqlite:////tmp/ci_test.db"
          SECRET_KEY: ci-test-secret-key-lazy-nerds-fixops-2026-very-secure

      - name: Upload Pytest Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-log
          path: pytest_output.log
          retention-days: 1

      - name: Annotate and Check Pytest Results
        if: always()
        run: |
          if [ -f pytest_output.log ]; then
            echo "## Backend Pytest Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 pytest_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.pytest_step.outputs.exit_code }}" != "0" ]; then
            grep -E "FAILED|ERROR" pytest_output.log | while IFS= read -r line; do
              echo "::error title=Pytest Test Failure::$line"
            done
            tail -n 50 pytest_output.log | while IFS= read -r line; do
              echo "::warning title=Pytest Failure Context::$line"
            done
            exit ${{ steps.pytest_step.outputs.exit_code }}
          fi
