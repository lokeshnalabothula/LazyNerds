version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fixops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fixops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fixops_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-fixops_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fixops_user} -d ${POSTGRES_DB:-fixops_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fixops-network

networks:
  fixops-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
