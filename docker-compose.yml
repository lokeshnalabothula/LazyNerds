services:
  postgres:
    image: postgres:16-alpine
    container_name: fixops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fixops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fixops_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-fixops_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fixops_user} -d ${POSTGRES_DB:-fixops_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fixops-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fixops-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fixops_user}:${POSTGRES_PASSWORD:-fixops_secure_password_2026}@postgres:5432/${POSTGRES_DB:-fixops_db}
      SECRET_KEY: ${SECRET_KEY:-fixops-secret-key-production-replace-me-2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      ENVIRONMENT: production
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fixops-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fixops-frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ""
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - fixops-network

networks:
  fixops-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
